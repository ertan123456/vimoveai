{% extends "base.html" %}
{% block title %}Giriş — ViMove AI{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:440px">
    <div class="card" style="padding:32px">
      <h1 style="font-size:1.7rem;margin:0 0 6px" data-en="Sign in" data-tr="Giriş yap">Giriş yap</h1>
      <p class="muted" style="margin:0 0 22px" data-en="Enter the username and password your specialist gave you."
         data-tr="Uzmanının verdiği kullanıcı adı ve şifreyi gir.">Uzmanının verdiği kullanıcı adı ve şifreyi gir.</p>
      <form id="loginForm">
        <label class="pmodal-label" data-en="Username" data-tr="Kullanıcı adı">Kullanıcı adı</label>
        <input class="pmodal-input" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" />
        <label class="pmodal-label" data-en="Password" data-tr="Şifre">Şifre</label>
        <input class="pmodal-input" id="loginPass" type="password" autocomplete="current-password" />
        <p id="loginErr" style="color:#b42318;min-height:1.2em;margin:10px 0 0;font-size:.92rem"></p>
        <button class="btn btn--primary btn--lg" type="submit" style="width:100%;margin-top:12px" data-en="Sign in" data-tr="Giriş yap">Giriş yap</button>
      </form>
      <div style="display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-400);font-size:.9rem">
        <span style="flex:1;height:1px;background:var(--ink-200)"></span><span data-en="or" data-tr="veya">veya</span><span style="flex:1;height:1px;background:var(--ink-200)"></span>
      </div>
      <button class="btn btn--secondary btn--lg" id="googleBtn" style="width:100%">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.6-5.2 3.6-8.9z"/>
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5H1.2v3.1A12 12 0 0 0 12 24z"/>
          <path fill="#FBBC05" d="M5.2 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.2a12 12 0 0 0 0 10.8l4-3.1z"/>
          <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 12 0 12 12 0 0 0 1.2 6.6l4 3.1C6.2 6.9 8.9 4.8 12 4.8z"/>
        </svg>
        <span data-en="Continue with Google" data-tr="Google ile devam et">Google ile devam et</span>
      </button>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/login.js?v=2"></script>{% endblock %}
