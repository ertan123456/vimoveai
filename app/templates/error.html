{% extends "base.html" %}
{% block title %}{{ title or "Something went wrong" }} — ViMove{% endblock %}

{% block content %}
<section class="msg-page">
  <div class="container">
    <div class="card msg-card">
      <div class="msg-icon warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h1 style="font-size:clamp(1.7rem,4vw,2.4rem)">{{ title or "Something went wrong" }}</h1>
      <p class="lead">{{ msg }}</p>
      <div class="actions">
        <a href="/start" class="btn btn--primary">Back to setup</a>
        <a href="/" class="btn btn--secondary">Go home</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
